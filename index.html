<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" href="./targets/targets.mind" as="fetch" crossorigin="anonymous" />
    <title>MindAR AR闪卡</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
      }
      
      a-scene {
        z-index: -1;
      }
      
      #info {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: Arial, sans-serif;
        font-size: 16px;
        background: rgba(0, 0, 0, 0.5);
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 100;
        text-align: center;
        pointer-events: none;
      }

      #arStartOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        padding: 24px;
        font-family: Arial, sans-serif;
        color: #fff;
        text-align: center;
      }

      #arStartOverlay.active {
        display: flex;
      }

      .ar-start-panel {
        width: min(100%, 360px);
      }

      #arStartBtn {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        background: #13c27b;
        color: #fff;
        font-size: 18px;
        font-weight: 700;
      }

      #arStartTip {
        margin-top: 14px;
        font-size: 14px;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.82);
      }
    </style>
  </head>
  <body>
    <div id="info">请扫描图像目标以查看AR效果</div>

    <div id="arStartOverlay">
      <div class="ar-start-panel">
        <button id="arStartBtn" type="button">开始 AR 体验</button>
        <div id="arStartTip">请允许访问摄像头。如无法启动，请确认微信或App相机权限已开启。</div>
      </div>
    </div>
    
    <a-scene 
      mindar-image="imageTargetSrc: ./targets/targets.mind; autoStart: false; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <!-- 3D模型 - 儿童文学 -->
        <a-asset-item id="childLit" src="./models/card/儿童文学.glb"></a-asset-item>
        <!-- 3D模型 - 儿童文学藏书票 -->
        <a-asset-item id="childLitBook" src="./models/card/儿童文学藏书票.glb"></a-asset-item>
        <!-- 3D模型 - 猫武士 -->
        <a-asset-item id="catWarrior" src="./models/card/猫武士.glb"></a-asset-item>
        <!-- 3D模型 - 少年报 -->
        <a-asset-item id="teenPaper" src="./models/card/少年报.glb"></a-asset-item>
        <!-- 3D模型 - 社庆藏书票 -->
        <a-asset-item id="annivBook" src="./models/card/社庆藏书票.glb"></a-asset-item>
        <!-- 3D模型 - 我们爱科学 -->
        <a-asset-item id="loveScience" src="./models/card/我们爱科学.glb"></a-asset-item>
        <!-- 3D模型 - 英语报72 -->
        <a-asset-item id="english72" src="./models/card/英语报72.glb"></a-asset-item>
        <!-- 3D模型 - 幼儿画报 -->
        <a-asset-item id="childPaper" src="./models/card/幼儿画报.glb"></a-asset-item>
        <!-- 3D模型 - 总社藏书票 -->
        <a-asset-item id="mainBook" src="./models/card/总社藏书票.glb"></a-asset-item>
        <!-- 背景音乐 -->
        <audio id="bgMusic" src="./music/bg.mp3" preload="auto" loop></audio>
        <!-- 视频资源（已屏蔽）
        <video id="arVideo" src="./videos/ar_video.mp4" preload="auto" playsinline muted loop></video>
        -->
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- ===== 目标0：儿童文学 ===== -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#childLit" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标1：儿童文学藏书票 ===== -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#childLitBook" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标2：猫武士 ===== -->
      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#catWarrior" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标3：少年报 ===== -->
      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#teenPaper" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标4：社庆藏书票 ===== -->
      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#annivBook" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标5：我们爱科学 ===== -->
      <a-entity mindar-image-target="targetIndex: 5">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#loveScience" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标6：英语报72 ===== -->
      <a-entity mindar-image-target="targetIndex: 6">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#english72" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标7：幼儿画报 ===== -->
      <a-entity mindar-image-target="targetIndex: 7">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#childPaper" animation-mixer />
      </a-entity>
      
      <!-- ===== 目标8：总社藏书票 ===== -->
      <a-entity mindar-image-target="targetIndex: 8">
        <a-gltf-model rotation="0 0 0" position="0 0 0" scale="1 1 1" src="#mainBook" animation-mixer />
      </a-entity>
    </a-scene>

    <!-- 引入必要的库 -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="./js/mindar-image-aframe.prod.js"></script>
    
    <script>
      const AR_TARGET_SRC = './targets/targets.mind';

      // 提前把识别数据放进浏览器缓存，避免点“开始”后才下载 5MB+ 的 targets.mind。
      if (window.fetch) {
        fetch(AR_TARGET_SRC, { cache: 'force-cache' }).catch(function(err) {
          console.log('AR识别数据预加载失败，将在启动时重试:', err);
        });
      }

    // ========== iOS微信摄像头黑屏修复补丁 ==========
    // 修复MindAR在iOS微信H5环境下摄像头黑屏问题
    (function() {
        // 保存原始的 play 方法
        const originalPlay = HTMLVideoElement.prototype.play;

        // 重写 play 方法
        HTMLVideoElement.prototype.play = function() {
            // 检查当前环境是否为iOS微信
            const isIOSWechat = /iPhone/i.test(navigator.userAgent) && /MicroMessenger/i.test(navigator.userAgent);

            if (isIOSWechat && this.srcObject) {
                // 针对iOS微信环境，在播放前主动加载视频元数据
                return new Promise((resolve, reject) => {
                    this.load();
                    const onLoadedMetadata = () => {
                        this.removeEventListener('loadedmetadata', onLoadedMetadata);
                        originalPlay.call(this).then(resolve).catch(reject);
                    };
                    this.addEventListener('loadedmetadata', onLoadedMetadata);
                });
            } else {
                // 非目标环境，调用原始的 play 方法
                return originalPlay.call(this);
            }
        };
    })();
    // ========== 修复补丁结束 ==========

      // 受限内置浏览器改为点击后启动AR，提升摄像头权限兼容性
      (function() {
        const ua = navigator.userAgent;
        const isiOS = /iPad|iPhone|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroidWebView = /Android/i.test(ua) &&
          (/\bwv\b/i.test(ua) || /Version\/[\d.]+.*Chrome\/[\d.]+.*Mobile Safari/i.test(ua));
        const needsManualStart = isiOS || isAndroidWebView;

        const sceneEl = document.querySelector('a-scene');
        const overlay = document.getElementById('arStartOverlay');
        const startBtn = document.getElementById('arStartBtn');
        const tip = document.getElementById('arStartTip');
        const info = document.getElementById('info');
        let arStarted = false;
        let arReady = false;
        let pendingStart = false;

        function startAR() {
          if (arStarted) {
            return true;
          }

          const system = sceneEl.systems && sceneEl.systems['mindar-image-system'];
          if (!system) {
            return false;
          }

          system.start();
          arStarted = true;
          return true;
        }

        function startWhenReady() {
          pendingStart = true;
          if (startAR()) {
            pendingStart = false;
            return;
          }

          sceneEl.addEventListener('renderstart', function() {
            if (pendingStart && startAR()) {
              pendingStart = false;
            }
          }, { once: true });
        }

        function showStartingUI(message) {
          overlay.classList.add('active');
          startBtn.disabled = true;
          startBtn.textContent = '正在启动...';
          tip.textContent = message;
        }

        function resetStartUI(message) {
          arStarted = false;
          arReady = false;
          pendingStart = false;
          overlay.classList.add('active');
          startBtn.disabled = false;
          startBtn.textContent = '重新启动 AR';
          tip.textContent = message;
        }

        sceneEl.addEventListener('arReady', function() {
          arReady = true;
          overlay.classList.remove('active');
          info.textContent = '请扫描图像目标以查看AR效果';
        });

        sceneEl.addEventListener('arError', function() {
          if (isAndroidWebView) {
            resetStartUI('摄像头启动失败。Android WebView需要宿主App在原生代码中允许网页摄像头权限，或请用Chrome打开。');
          } else if (isiOS) {
            resetStartUI('摄像头启动失败，请确认微信相机权限已开启，或用Safari打开。');
          } else {
            info.textContent = '摄像头启动失败，请检查浏览器权限。';
          }
        });

        if (!needsManualStart) {
          if (!startAR()) {
            sceneEl.addEventListener('renderstart', startAR, { once: true });
          }
          info.textContent = '正在启动相机和识别数据...';
          return;
        }

        overlay.classList.add('active');
        info.textContent = '点击开始按钮启动AR';

        startBtn.addEventListener('click', function() {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            tip.textContent = isAndroidWebView
              ? '当前Android WebView不支持摄像头AR，请升级系统WebView、开启App摄像头权限，或用Chrome打开。'
              : '当前微信环境不支持摄像头AR，请升级iOS/微信或用Safari打开。';
            return;
          }

          showStartingUI('请在系统弹窗中允许访问摄像头。相机开启后会继续初始化识别数据，请稍候。');

          try {
            startWhenReady();
            setTimeout(function() {
              if (!arReady) {
                tip.textContent = '相机已请求启动，正在加载识别数据和追踪器...';
              }
            }, 900);
          } catch (err) {
            console.log('启动AR失败:', err);
            startBtn.disabled = false;
            startBtn.textContent = '重新启动 AR';
            tip.textContent = isAndroidWebView
              ? '启动失败，请确认App已开放网页摄像头权限，或用Chrome打开。'
              : '启动失败，请刷新页面后重试，或用Safari打开。';
          }
        });
      })();

      // 背景音乐控制
      (function() {
        const audio = document.getElementById('bgMusic');
        let isPlaying = false;
        let targetFound = false;

        // 目标名称映射（按图片素材/透卡 目录文件顺序）
        const targetNames = {
          0: '儿童文学',
          1: '儿童文学藏书票',
          2: '猫武士',
          3: '少年报',
          4: '社庆藏书票',
          5: '我们爱科学',
          6: '英语报72',
          7: '幼儿画报',
          8: '总社藏书票'
        };

        // 监听目标检测事件
        document.addEventListener('targetFound', function(event) {
          targetFound = true;
          const targetIndex = event.detail ? event.detail.targetIndex : undefined;
          const name = targetIndex !== undefined ? targetNames[targetIndex] : '';
          document.getElementById('info').textContent = name ? `✅ 已识别：${name}` : '✅ 目标已识别！';
          playMusic();
        });

        document.addEventListener('targetLost', function() {
          targetFound = false;
          document.getElementById('info').textContent = '请扫描图像目标以查看AR效果';
          pauseMusic();
        });

        function playMusic() {
          if (!isPlaying && audio) {
            audio.play().then(() => {
              isPlaying = true;
              console.log('背景音乐已开始播放');
            }).catch(err => {
              console.log('播放音乐失败（可能需要用户交互）:', err);
            });
          }
        }

        function pauseMusic() {
          if (isPlaying && audio) {
            audio.pause();
            isPlaying = false;
            console.log('背景音乐已暂停');
          }
        }

        // 如果用户点击页面，尝试播放（解决自动播放策略）
        document.addEventListener('click', function() {
          if (targetFound && !isPlaying) {
            playMusic();
          }
        });

        console.log('背景音乐系统已初始化');
      })();

      // ========== AR空间视频控制（已屏蔽）==========
      // (function() {
      //   const video = document.getElementById('arVideo');
      //   function playARVideo() {
      //     if (video) {
      //       if (!video.src || video.src === '' || video.src.endsWith('/')) {
      //         console.log('未配置视频文件，请在 <video> 标签中设置 src');
      //         return;
      //       }
      //       video.currentTime = 0;
      //       video.play().then(() => {
      //         console.log('AR空间视频已开始播放');
      //       }).catch(err => {
      //         console.log('播放视频失败:', err);
      //         video.muted = true;
      //         video.play().then(() => {
      //           console.log('AR空间视频已静音播放');
      //         }).catch(err2 => {
      //           console.log('静音播放也失败:', err2);
      //         });
      //       });
      //     }
      //   }
      //   function pauseARVideo() {
      //     if (video) {
      //       video.pause();
      //       console.log('AR空间视频已暂停');
      //     }
      //   }
      //   window.playARVideo = playARVideo;
      //   window.pauseARVideo = pauseARVideo;
      //   console.log('AR空间视频系统已初始化');
      // })();
    </script>
  </body>
</html>
